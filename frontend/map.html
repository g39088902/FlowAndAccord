<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow & Accord · 地图图鉴</title>
  <link rel="stylesheet" href="map.css">
</head>
<body>
  <main class="map-page">
    <iframe id="map-frame" title="与正式游戏一致的只读地形地图" tabindex="-1"></iframe>

    <header class="map-header">
      <a class="map-brand" href="index.html" title="返回模拟世界">Flow & Accord <span>地图图鉴</span></a>
      <div class="map-header-copy">正式地形生成器 · 只读地图 · 无 POI、路网、居民或存档</div>
    </header>

    <aside class="map-panel" aria-label="地图控制">
      <div class="map-panel-title">同种子地形预览</div>
      <p class="map-panel-desc">此页直接使用正式游戏的 WASM 地形生成与 Canvas 渲染链路。相同种子在这里和正式游戏中会得到相同地貌；仅不播撒任何游戏实体与路网。</p>

      <label class="map-control-label" for="terrain-seed">世界种子</label>
      <div class="seed-row">
        <input id="terrain-seed" class="map-input" type="number" min="0" max="9007199254740991" step="1" inputmode="numeric" value="20260910">
        <button id="btn-reroll" class="map-button" type="button">刷新地图</button>
      </div>
      <a id="btn-use-in-game" class="map-use-button" href="index.html" title="以当前种子启动正式游戏">在正式游戏中使用此种子</a>
      <div class="map-seed-note">地图页不会创建或读取存档。滚轮缩放；左键拖拽平移；右键拖拽旋转视角。</div>

      <div class="map-legend">
        <div><span class="legend-dot legend-land"></span>地形与坡面</div>
        <div><span class="legend-dot legend-water"></span>河道与浅滩</div>
        <div><span class="legend-dot legend-vegetation"></span>自然装饰</div>
      </div>
    </aside>

    <section class="map-caption" aria-live="polite">
      <div class="map-title">正式世界地貌</div>
      <p class="map-description">读取同一套确定性 TerrainMap 数据和正式游戏的渲染管线。这里刻意不生成 Agent、POI、房屋、账本或路网。</p>
      <div class="map-tags"><span>确定性种子</span><span>WASM 地形</span><span>只读预览</span></div>
    </section>
  </main>
  <script src="js/map-view.js"></script>
</body>
</html>
